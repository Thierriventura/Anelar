<div class="elegant-container">
    <div class="form-wrapper">
        <h2 class="form-title">Criar Conta</h2>
        <p class="form-subtitle">Junte-se a nós para uma experiência exclusiva.</p>

        <form class="elegant-form">
            <h3 class="section-title">Dados Pessoais</h3>
            
            <div class="input-row">
                <div class="input-group full-width">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" placeholder="Como deseja ser chamado(a)?" required>
                </div>
            </div>
            
            <div class="input-row">
                <div class="input-group">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" placeholder="000.000.000-00" required>
                </div>
                <div class="input-group">
                    <label for="nascimento">Data de Nascimento</label>
                    <input type="date" id="nascimento" required>
                </div>
            </div>

            <div class="input-row">
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="seu@melhoremail.com.br" required>
                </div>
                <div class="input-group">
                    <label for="telefone">Telefone / Celular</label>
                    <input type="tel" id="telefone" placeholder="(11) 90000-0000" required>
                </div>
            </div>

            <h3 class="section-title mt-4">Endereço de Entrega</h3>
            
            <div class="input-row">
                <div class="input-group">
                    <label for="cep">CEP</label>
                    <input type="text" id="cep" placeholder="00000-000" required>
                </div>
                <div class="input-group">
                    <label for="cidade">Cidade / Estado</label>
                    <input type="text" id="cidade" placeholder="Ex: São Paulo - SP" required>
                </div>
            </div>

            <div class="input-row">
                <div class="input-group full-width">
                    <label for="rua">Logradouro (Rua, Avenida, etc)</label>
                    <input type="text" id="rua" placeholder="Nome da sua rua" required>
                </div>
            </div>

            <div class="input-row">
                <div class="input-group">
                    <label for="numero">Número</label>
                    <input type="text" id="numero" placeholder="Nº" required>
                </div>
                <div class="input-group">
                    <label for="complemento">Complemento (Opcional)</label>
                    <input type="text" id="complemento" placeholder="Apto, Bloco, Casa 2">
                </div>
            </div>

            <h3 class="section-title mt-4">Segurança</h3>
            
            <div class="input-row">
                <div class="input-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Crie uma senha forte" required>
                </div>
                <div class="input-group">
                    <label for="confirmaSenha">Confirme a Senha</label>
                    <input type="password" id="confirmaSenha" placeholder="Repita a senha" required>
                </div>
            </div>

            <button type="submit" class="btn-primary btn-full mt-4">Concluir Cadastro</button>
        </form>

        <div class="form-footer">
            <p>Já possui uma conta?</p>
            <a href="login" class="link-elegant">Faça login aqui</a>
        </div>
    </div>
</div>
